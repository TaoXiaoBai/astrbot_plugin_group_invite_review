name: astrbot_plugin_group_invite_guard
desc: |
  加群邀请守卫：让机器人用自己的人格设定判断是否接受加群邀请，并参考目标群成员与历史印象；支持自动同意/拒绝或仅通知管理员，也能识别私聊加群意图。
  A group-invite guard that decides using the bot's persona, target-group members and chat history; supports auto approve/reject or admin-only notify, and detects private-chat invite intent.
author: Kimi
version: 1.2.0
repo: "https://github.com/TaoXiaoBai/astrbot_plugin_group_invite_review"
display_name: 加群邀请守卫
short_desc: 用人格 + 成员/印象判断加群邀请与私聊意图
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16"
